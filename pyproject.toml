[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aldau"
version = "0.1.0"
description = "Scam-ad detector for Kazakhstan marketplaces (teacher-student distillation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

# Heavy dependencies are optional so that tests and CI install in seconds.
# Install what a phase needs, e.g.  pip install -e ".[dev,llm]"
[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
llm = ["anthropic", "google-genai", "openai"]
# ml = light classic ML (baseline, EDA); deep = neural networks (Phase 5 student)
ml = ["scikit-learn", "matplotlib", "pandas"]
# torch with CUDA must come from the PyTorch index, see CLAUDE.md "Commands".
# `datasets` is left out: its pyarrow DLL is blocked on the owner's laptop and a plain
# torch Dataset is enough for a few thousand ads.
deep = ["transformers", "torch"]
# pHash is implemented by hand (photos.py), so only Pillow is needed
photos = ["Pillow"]
bot = ["aiogram>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F = basic errors, I = import order, UP = modern syntax, B = common bugs
select = ["E", "F", "I", "UP", "B"]
